<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSR Cast Overlay</title><meta name="robots" content="noindex">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#bug{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .3s}
#bug.hide{opacity:0}
.row{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;background:rgba(10,13,24,.92);border:1px solid rgba(120,150,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.team{display:flex;align-items:center;gap:12px;padding:10px 18px;min-width:230px;color:#fff;font-weight:800;font-size:24px;white-space:nowrap}
.team.b{flex-direction:row-reverse;text-align:right}
.team img{width:46px;height:46px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.06)}
.team .ph{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.1)}
.score{display:flex;align-items:center;gap:12px;padding:0 20px;background:linear-gradient(180deg,#1a2347,#0f1630);color:#fff;font-weight:900;font-size:38px;font-variant-numeric:tabular-nums}
.score i{font-style:normal;opacity:.5;font-size:26px}
.score .w{color:#19e3ff}
.sub{padding:5px 16px;border-radius:999px;background:rgba(10,13,24,.88);border:1px solid rgba(120,150,255,.3);color:#cfd6f0;font-weight:700;font-size:15px;letter-spacing:.04em}
</style></head><body>
<div id="bug" class="hide"><div class="row"><div class="team a"><span class="ph"></span><span id="an">—</span></div><div class="score"><span id="am">0</span><i>:</i><span id="bm">0</span></div><div class="team b"><span class="ph"></span><span id="bn">—</span></div></div><div class="sub" id="sub"></div></div>
<script src="msr-config.js"></script>
<script>
(function(){
  var cfg=window.MSR_CONFIG||{},url=cfg.SUPABASE_URL+'/rest/v1/msr_cast_state?id=eq.1&select=state,updated_at',last='';
  var bug=document.getElementById('bug');
  function logo(el,t){var old=el.querySelector('img,.ph');var n;if(t.logo){n=document.createElement('img');n.src=t.logo;n.alt='';}else{n=document.createElement('span');n.className='ph';}if(old)old.replaceWith(n);}
  function render(s){
    var key=JSON.stringify(s);if(key===last)return;last=key;
    if(!s||!s.a||!s.a.name||!s.b||!s.b.name||s.visible===false){bug.classList.add('hide');return;}
    var ta=bug.querySelector('.team.a'),tb=bug.querySelector('.team.b');
    document.getElementById('an').textContent=s.a.tag||s.a.name;document.getElementById('bn').textContent=s.b.tag||s.b.name;
    logo(ta,s.a);logo(tb,s.b);
    var am=document.getElementById('am'),bm=document.getElementById('bm');
    am.textContent=s.aMaps;bm.textContent=s.bMaps;
    var need=Math.ceil((s.bo||3)/2);am.className=s.aMaps>=need?'w':'';bm.className=s.bMaps>=need?'w':'';
    var parts=['BO'+(s.bo||3)];if(s.map)parts.push(s.map);if(s.showRounds)parts.push(s.aRounds+' : '+s.bRounds);
    document.getElementById('sub').textContent=parts.join('  ·  ');
    bug.classList.remove('hide');
  }
  function poll(){
    fetch(url,{headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+cfg.SUPABASE_ANON_KEY},cache:'no-store'})
      .then(function(r){return r.json();}).then(function(rows){render(rows&&rows[0]&&rows[0].state);}).catch(function(){});
  }
  poll();setInterval(poll,1000);
})();
</script></body></html>
