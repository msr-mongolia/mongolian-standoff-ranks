<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSR Cast Control</title><meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0e1a;color:#e8ecf4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:6px 0 14px}
.card{background:#141a30;border:1px solid #27315a;border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:#9aa6cf;margin:8px 0 4px;font-weight:700}
select,input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #2f3b6b;background:#0d1226;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer;color:#fff;background:#2a4bd7}
button.g{background:#1d7a4a}button.r{background:#8a2b2b}button.n{background:#2b3358}
.big{font-size:44px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.small{font-size:13px;color:#9aa6cf}#msg{min-height:20px;font-size:13px;color:#7fe0a8;margin-top:6px}
#lock{display:block}#app{display:none}
</style></head><body>
<h1>MSR Cast удирдлага</h1>
<div id="lock" class="card"><label>Нууц код</label><input id="pw" type="password" autocomplete="current-password"><div style="height:10px"></div><button id="go" style="width:100%">Нэвтрэх</button><div id="msg0" class="small"></div></div>
<div id="app">
 <div class="card"><div class="grid"><div><label>Баг A</label><select id="ta"></select></div><div><label>Баг B</label><select id="tb"></select></div></div>
  <div class="grid"><div><label>Цуврал</label><select id="bo"><option value="1">BO1</option><option value="3" selected>BO3</option><option value="5">BO5</option></select></div>
  <div><label>Одоогийн map</label><input id="map" list="maps" placeholder="Sandstone"><datalist id="maps"><option>Sandstone<option>Province<option>Rust<option>Breeze<option>Dune<option>Hanami<option>Prison</datalist></div></div></div>
 <div class="card"><div class="small">Map-ын хожил</div><div class="big"><span id="am">0</span> : <span id="bm">0</span></div>
  <div class="grid"><button class="g" id="aw">A баг map хожлоо</button><button class="g" id="bw">B баг map хожлоо</button>
  <button class="n" id="am-">A −1</button><button class="n" id="bm-">B −1</button></div></div>
 <div class="card"><div class="small">Раундын оноо (заавал биш)</div><div class="big"><span id="ar">0</span> : <span id="br">0</span></div>
  <div class="grid"><button id="ar+">A раунд +1</button><button id="br+">B раунд +1</button><button class="n" id="ar-">A −1</button><button class="n" id="br-">B −1</button></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="sr" style="width:auto"> Раундын оноог overlay дээр харуулах</label></div>
 <div class="card"><div class="grid"><button class="n" id="vis">Overlay нуух / харуулах</button><button class="r" id="rst">Шинэ тоглолт (0:0)</button></div><div id="msg"></div></div>
</div>
<script src="msr-config.js"></script>
<script>
(function(){
  var cfg=window.MSR_CONFIG||{},FN=cfg.SUPABASE_URL+'/functions/v1/msr-cast',pass='',teams=[],S={aMaps:0,bMaps:0,aRounds:0,bRounds:0,visible:true};
  try{pass=sessionStorage.getItem('msr_cast_pw')||'';}catch(e){}
  var $=function(i){return document.getElementById(i);};
  function api(o){o.passcode=pass;return fetch(FN,{method:'POST',headers:{'content-type':'application/json',apikey:cfg.SUPABASE_ANON_KEY},body:JSON.stringify(o)}).then(function(r){return r.json();});}
  function find(v){return teams[+v]||{name:'',tag:'',logo:''};}
  function ui(){$('am').textContent=S.aMaps;$('bm').textContent=S.bMaps;$('ar').textContent=S.aRounds;$('br').textContent=S.bRounds;}
  function push(){
    S.a=find($('ta').value);S.b=find($('tb').value);S.bo=+$('bo').value;S.map=$('map').value;S.showRounds=$('sr').checked;ui();
    api({state:S}).then(function(r){$('msg').textContent=r.ok?'✔ Overlay шинэчлэгдлээ':'Алдаа: '+(r.error||'');}).catch(function(){$('msg').textContent='Холболтын алдаа';});
  }
  function bump(k,d,max){S[k]=Math.max(0,Math.min(max,S[k]+d));push();}
  function enter(){
    $('lock').style.display='none';$('app').style.display='block';
    fetch(cfg.SUPABASE_URL+'/rest/v1/msr_discord_teams?select=name,tag,logo_url&order=name.asc',{headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+cfg.SUPABASE_ANON_KEY}}).then(function(r){return r.json();}).then(function(rows){
      teams=(rows||[]).filter(function(t){return t.name;}).map(function(t){return {name:t.name,tag:t.tag||'',logo:t.logo_url||''};});
      var h='<option value="-1">— сонгох —</option>'+teams.map(function(t,i){return '<option value="'+i+'">'+t.name.replace(/</g,'&lt;')+(t.tag?' ['+t.tag.replace(/</g,'&lt;')+']':'')+'</option>';}).join('');
      $('ta').innerHTML=h;$('tb').innerHTML=h;
    });
    fetch(cfg.SUPABASE_URL+'/rest/v1/msr_cast_state?id=eq.1&select=state',{headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+cfg.SUPABASE_ANON_KEY}}).then(function(r){return r.json();}).then(function(x){var s=x&&x[0]&&x[0].state;if(s&&s.a){S.aMaps=s.aMaps||0;S.bMaps=s.bMaps||0;S.aRounds=s.aRounds||0;S.bRounds=s.bRounds||0;S.visible=s.visible!==false;$('bo').value=s.bo||3;$('map').value=s.map||'';$('sr').checked=!!s.showRounds;ui();}});
  }
  $('go').onclick=function(){pass=$('pw').value;api({check:true}).then(function(r){if(r.ok){try{sessionStorage.setItem('msr_cast_pw',pass);}catch(e){}enter();}else $('msg0').textContent='Нууц код буруу байна.';}).catch(function(){$('msg0').textContent='Холболтын алдаа';});};
  if(pass)api({check:true}).then(function(r){if(r.ok)enter();});
  $('aw').onclick=function(){S.aMaps=Math.min(5,S.aMaps+1);S.aRounds=0;S.bRounds=0;push();};
  $('bw').onclick=function(){S.bMaps=Math.min(5,S.bMaps+1);S.aRounds=0;S.bRounds=0;push();};
  $('am-').onclick=function(){bump('aMaps',-1,5);};$('bm-').onclick=function(){bump('bMaps',-1,5);};
  $('ar+').onclick=function(){bump('aRounds',1,30);};$('br+').onclick=function(){bump('bRounds',1,30);};
  $('ar-').onclick=function(){bump('aRounds',-1,30);};$('br-').onclick=function(){bump('bRounds',-1,30);};
  $('vis').onclick=function(){S.visible=!S.visible;push();};
  $('rst').onclick=function(){if(!confirm('Шинэ тоглолт эхлүүлэх үү? Оноо 0:0 болно.'))return;S.aMaps=S.bMaps=S.aRounds=S.bRounds=0;$('map').value='';push();};
  ['ta','tb','bo','sr'].forEach(function(i){$(i).onchange=push;});$('map').onchange=push;
})();
</script></body></html>
