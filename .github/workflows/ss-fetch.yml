name: ss-fetch
on:
  push:
    branches: [ss-fetch]
    paths: [ss-list.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download result screenshots from Supabase storage
        run: |
          mkdir -p ss
          for f in $(cat ss-list.txt); do
            [ -f "ss/$f" ] || curl -sfL -o "ss/$f" "https://gqepygqtgosvpfirahgd.supabase.co/storage/v1/object/public/team-logos/ros/$f" || echo "miss $f"
          done
          ls ss | wc -l
      - name: Commit
        run: |
          git config user.name msr-bot
          git config user.email msr-bot@users.noreply.github.com
          git add ss
          git commit -m "ss: cache result screenshots" || exit 0
          git push
