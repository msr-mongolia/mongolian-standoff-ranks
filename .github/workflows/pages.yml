name: Deploy MSR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Cancel stuck Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          for sha in d8dcac58a17caa15fb0da42c2ee8c1375062d740 $(git log -12 --format=%H | tail -n +2); do
            echo "== cancel $sha"; gh api -X POST "repos/$R/pages/deployments/$sha/cancel" 2>&1 | head -c 300 || true; echo
          done
          echo "== deployments"; gh api "repos/$R/deployments?environment=github-pages&per_page=6" --jq '.[]|[.id,.sha[0:7]]|@tsv' 2>&1 | head -10
          for id in $(gh api "repos/$R/deployments?environment=github-pages&per_page=6" --jq '.[].id' 2>/dev/null); do
            echo "status $id: $(gh api "repos/$R/deployments/$id/statuses" --jq '.[0].state' 2>&1)"
          done
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
